apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: deployments-ai-service:latest
          imagePullPolicy: Never
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: OLLAMA_HOST
              value: "http://host.k3d.internal:11434"
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: common-secret
                  key: TELEGRAM_TOKEN