apiVersion: apps/v1
kind: Deployment
metadata:
  name: checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checker
  template:
    metadata:
      labels:
        app: checker
    spec:
      containers:
        - name: checker
          image: deployments-checker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secret