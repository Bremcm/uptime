apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: deployments-migrate:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: common-secret
                  key: DATABASE_URL