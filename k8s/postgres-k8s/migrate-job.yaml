apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: golang:1.26
          command:
            - /bin/sh
            - -c
            - |
              go install github.com/pressly/goose/v3/cmd/goose@latest
              goose -dir /migrations postgres "$DATABASE_URL" up
          envFrom:
            - secretRef:
                name: common-secret
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: migrations-sql