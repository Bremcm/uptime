[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-cli"
version = "0.1.0"
description = "Command-line client for the Uptime monitoring API"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
uptime = "uptime_cli.main:app"

[tool.setuptools]
packages = ["uptime_cli"]