x-common-env: &common-env
  DATABASE_URL: postgres://uptime:uptime@postgres:5432/uptime?sslmode=disable
  KAFKA_BROKERS: kafka:19092
  JWT_SECRET: ${JWT_SECRET}
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
  HTTP_ADDR: ":8080"
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: uptime-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - uptime-kafka:/var/lib/kafka/data
  postgres:
    image: postgres:17-alpine
    container_name: uptime-db
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
      POSTGRES_DB: uptime
    ports:
      - "5433:5432"
    volumes:
      - uptime-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime"]
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build:
      context: ..
      args:
        SERVICE: api
    environment:
      <<: *common-env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka

  checker:
    build:
      context: ..
      args:
        SERVICE: checker
    environment:
      <<: *common-env
    depends_on:
      - kafka

  detector:
    build:
      context: ..
      args:
        SERVICE: detector
    environment:
      <<: *common-env
    depends_on:
      - postgres
      - kafka

  notifier:
    build:
      context: ..
      args:
        SERVICE: notifier
    environment:
      <<: *common-env
    depends_on:
      - kafka
  ai-service:
    build:
      context: ../ai-service
    environment:
      KAFKA_BROKERS: kafka:19092
      OLLAMA_HOST: http://host.docker.internal:11434
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    depends_on:
      - kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  uptime-pgdata:
  uptime-kafka: