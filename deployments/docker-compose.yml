x-common-env: &common-env
  DATABASE_URL: postgres://uptime:uptime@postgres:5432/uptime?sslmode=disable
  KAFKA_BROKERS: kafka:19092
  JWT_SECRET: ${JWT_SECRET}
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
  HTTP_ADDR: ":8080"
  CLICKHOUSE_ADDR: clickhouse:9000
services:
  kafka-init:
      image: apache/kafka:3.9.0
      depends_on:
        kafka:
          condition: service_healthy
      entrypoint: ["/bin/sh", "-c"]
      command: |
        "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic checks --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic check-results --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic incidents --partitions 3 --replication-factor 1
        "
  migrate:
    image: golang:1.26
    working_dir: /app
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      go install github.com/pressly/goose/v3/cmd/goose@latest
      goose -dir migrations postgres 'postgres://uptime:uptime@postgres:5432/uptime?sslmode=disable' up
      "
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    volumes:
      - ./clickhouse/init.sql:/init.sql:ro
    entrypoint: >
      sh -c "clickhouse-client --host clickhouse --queries-file /init.sql"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"
  kafka:
    image: apache/kafka:3.9.0
    container_name: uptime-kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - uptime-kafka:/var/lib/kafka/data
  postgres:
    image: postgres:17-alpine
    container_name: uptime-db
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
      POSTGRES_DB: uptime
    ports:
      - "5433:5432"
    volumes:
      - uptime-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime"]
      interval: 5s
      timeout: 5s
      retries: 5
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: uptime-clickhouse
    environment:
      <<: *common-env
      CLICKHOUSE_ADDR: clickhouse:9000
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - uptime-clickhouse:/var/lib/clickhouse
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/override.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  api:
    build:
      context: ..
      args:
        SERVICE: api
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "8080:8080"
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  checker:
    build:
      context: ..
      args:
        SERVICE: checker
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  detector:
    build:
      context: ..
      args:
        SERVICE: detector
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      migrate:
          condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
  archiver:
    build:
      context: ..
      args:
        SERVICE: archiver
    restart: unless-stopped
    environment:
      <<: *common-env
      CLICKHOUSE_ADDR: clickhouse:9000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_started
      clickhouse-init:
        condition: service_completed_successfully

  notifier:
    build:
      context: ..
      args:
        SERVICE: notifier
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
  ai-service:
    build:
      context: ../ai-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:19092
      OLLAMA_HOST: http://host.docker.internal:11434
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  uptime-pgdata:
  uptime-kafka:
  uptime-clickhouse: